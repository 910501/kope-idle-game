<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KO-PE Idle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>KO-PE Idle</h1>

    <h2>全能嚮導</h2>

    <p id="level">等級：1
	</p>

    <p id="exp">EXP：0 / 100
	</p>

    <p id="money">黑金晶片：0
	</p>

    <hr>

    <h3>目前探索區域</h3>

	<p id="area-name">
    外圍廢墟
	</p>

	<h3>選擇探索區域</h3>

	<div id="area-list"></div>

	<button id="explore-btn">
    開始探索
	</button>

    <p>□□□□□□□□□□</p>

    <p id="countdown">剩餘時間：2 秒
	</p>

    <hr>

    <h3>素材</h3>

    <p id="scrap">廢鐵：0
	</p>

    <p id="wire">破損電線：0
	</p>

    <hr>

    <h3>探索紀錄</h3>

    <p id="log">等待開始探索……
	</p>
<hr>

<section id="event-panel" hidden>

    <h2 id="event-title">
        特殊事件
    </h2>

    <p id="event-description">
        事件內容
    </p>

    <div id="event-options">
    </div>

</section>
    <script src="game.js"></script>

</body>

</html>
